---
- name: "Create Traefik System Group"
  ansible.builtin.group:
    name: '{{ traefik_name }}'
    system: true

- name: "Create Traefik System User"
  ansible.builtin.user:
    name: '{{ traefik_name }}'
    system: true
    shell: '/bin/false'
    group: '{{ traefik_name }}'
    create_home: false

- name: "Create Bin Folder"
  ansible.builtin.file:
    path: "{{ traefik_opt }}"
    state: directory
    owner: '{{ traefik_name }}'
    group: '{{ traefik_name }}'

- name: "Download Version"
  register: download_version
  ansible.builtin.get_url:
    url: "{{ traefik_url }}_linux_{{ traefik_arch }}.tar.gz"
    dest: "{{ _traefik_tarball }}"
    checksum: "sha256:{{ traefik_url }}_checksums.txt"
    owner: '{{ traefik_name }}'
    group: '{{ traefik_name }}'
    mode: '0644'

- name: "Create Version Folder"
  ansible.builtin.file:
    path: "{{ _traefik_version_dir }}"
    state: directory
    owner: '{{ traefik_name }}'
    group: '{{ traefik_name }}'

- name: "Expand Version"
  # Only when check mode itself prevented the download (fresh host + --check):
  # nothing to unarchive yet, and unarchive can't no-op past a missing src the
  # way get_url does. On a real run, `creates` alone drives idempotency, so a
  # manually removed binary still gets repaired even if the tarball didn't change.
  when: not (ansible_check_mode and download_version is changed)
  register: expand_version
  ansible.builtin.unarchive:
    src: "{{ _traefik_tarball }}"
    dest: "{{ _traefik_version_dir }}"
    remote_src: true
    creates: "{{ _traefik_version_dir }}/{{ traefik_name }}"

- name: "Change Folder Permissions"
  when: expand_version is changed
  ansible.builtin.file:
    path: "{{ _traefik_version_dir }}"
    state: directory
    recurse: yes
    owner: '{{ traefik_name }}'
    group: '{{ traefik_name }}'

- name: "Symlink Active Binary"
  notify: traefik_restart
  ansible.builtin.file:
    src: "{{ _traefik_version_dir }}/{{ traefik_name }}"
    dest: "{{ traefik_opt }}/{{ traefik_name }}"
    state: link
    # Existing hosts have /opt/traefik/traefik as a regular file from the old
    # in-place extraction; force lets the symlink replace it on migration.
    force: true
    follow: false
    owner: '{{ traefik_name }}'
    group: '{{ traefik_name }}'

- name: "List Installed Versions"
  ansible.builtin.find:
    paths: "{{ traefik_opt }}"
    patterns: '{{ traefik_name }}-*-linux-{{ traefik_arch }}'
    file_type: directory
    recurse: false
  register: traefik_installed_versions

- name: "Compute Versions To Prune"
  ansible.builtin.set_fact:
    traefik_versions_to_prune: >-
      {{
        (
          traefik_installed_versions.files
          | sort(attribute='mtime', reverse=true)
          | rejectattr('path', 'equalto', _traefik_version_dir)
          | list
        )[traefik_keep_versions:]
      }}

- name: "Prune Old Versions"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ traefik_versions_to_prune | map(attribute='path') | product(['', '.tar.gz']) | map('join') | list }}"
  loop_control:
    label: '{{ item }}'

- name: "Create Config Folder"
  ansible.builtin.file:
    path: '{{ traefik_conf_d }}'
    state: directory
    owner: '{{ traefik_name }}'
    group: '{{ traefik_name }}'      
    
- name: "Create acme.json"
  ansible.builtin.file:
    path: '{{ traefik_etc }}/acme.json'
    state: touch
    owner: '{{ traefik_name }}'
    group: '{{ traefik_name }}'
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: "Template Traefik Service"
  register: template_traefik_service
  ansible.builtin.template:
    src: '../templates/{{ traefik_name }}-service.j2'
    dest: '{{ systemd_conf }}/{{ traefik_name }}.service'
    owner: root
    group: root
    mode: '0644'
    backup: false

- name: "Enable Traefik Service"
  when: template_traefik_service.changed
  ansible.builtin.systemd:
    name: '{{ traefik_name }}.service'
    daemon_reload: true
    enabled: true

- name: "Template Traefik Config"
  notify: traefik_restart
  ansible.builtin.template:
    src: '../templates/{{ traefik_name }}-config.j2'
    dest: '{{ traefik_etc }}/{{ traefik_name }}.yml'
    owner: '{{ traefik_name }}'
    group: '{{ traefik_name }}'
    mode: "0644"
    backup: false

- name: "Template Traefik Routing Configs"
  ansible.builtin.copy:
    content: '{{ item.content | to_nice_yaml(indent=2) }}'
    dest: '{{ traefik_conf_d }}/routing-{{ item.name }}-config.yml'
    owner: '{{ traefik_name }}'
    group: '{{ traefik_name }}'
    mode: "0644"
  loop:
    - { name: 'http', content: '{{ traefik_routing_http }}' }
    - { name: 'tcp', content: '{{ traefik_routing_tcp }}' }
    - { name: 'udp', content: '{{ traefik_routing_udp }}' }
    - { name: 'tls', content: '{{ traefik_routing_tls }}' }
